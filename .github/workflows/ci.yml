name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts (bash -n y shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sintaxis con bash -n
        run: for f in *.sh site/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck --version && shellcheck *.sh site/*.sh

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .env de ejemplo (valores ficticios)
        run: |
          cp .env.example .env
          sed -i -e 's/^PIHOLE_PASSWORD=.*/PIHOLE_PASSWORD=solo-para-ci/' \
                 -e 's/^LOCAL_DNS_HOSTS=.*/LOCAL_DNS_HOSTS="192.168.1.50 aria.lan"/' .env
      - name: docker compose config
        run: docker compose config -q
      - name: Puertos publicados esperados (solo 53, 8080 y 8443)
        run: |
          puertos=$(docker compose config --format json | jq -r '.services[].ports[]?.published' | sort -u | tr '\n' ' ')
          echo "Publicados: $puertos"
          [ "$puertos" = "53 8080 8443 " ] || { echo "::error::Puertos publicados inesperados: $puertos"; exit 1; }

  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (binario oficial con suma de comprobación)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Historial completo y árbol de trabajo
        run: |
          ./gitleaks git . --redact --no-banner -v
          ./gitleaks dir . --redact --no-banner -v

  web:
    name: Web estática (site/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir
        run: site/construir.sh _site
      - name: Sin estilos ni scripts en línea, sin innerHTML
        run: |
          if grep -nE 'style=|<script>|on(click|load|error)=' _site/*.html; then echo "::error::Estilos/scripts en línea: rompen la CSP"; exit 1; fi
          if grep -nE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write' _site/*.js; then echo "::error::Usa textContent"; exit 1; fi
          grep -q 'Content-Security-Policy' _site/index.html || { echo "::error::Falta la CSP"; exit 1; }
      - name: Las imágenes y archivos enlazados existen
        run: |
          fallo=0
          for ruta in $(grep -ohE '(src|href|srcset)="[^"#:]+"' _site/*.html | sed -E 's/^[a-z]+="//; s/"$//' | sort -u); do
            [ -e "_site/$ruta" ] || { echo "::error::No existe: $ruta"; fallo=1; }
          done
          exit $fallo
      - name: JavaScript válido
        run: for f in _site/*.js; do node --check "$f"; done
