name: shield-dns

services:
  unbound:
    image: klutchell/unbound:1.26.1@sha256:9a3939ca33d6d3b42b81a70391bb8e43f0a08d2bd7a3fdffb43d427493345c36
    container_name: shield-unbound
    restart: unless-stopped
    # Probado en un compose aislado (24/10/2026): arranca sano y valida DNSSEC con esta opción.
    security_opt:
      - no-new-privileges:true
    networks:
      shield:
        ipv4_address: 172.30.53.2
    healthcheck:
      test: ["CMD", "drill-hc", "@127.0.0.1", "dnssec.works"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  pihole:
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    container_name: shield-pihole
    restart: unless-stopped
    # Sin no-new-privileges a propósito: con esa opción pihole-FTL pierde CAP_NET_BIND_SERVICE y
    # CAP_NET_RAW (probado el 24/10/2026) y el panel muestra avisos. Ver MEMORY.md.
    depends_on:
      - unbound
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${WEB_HTTP_PORT:-8080}:8080/tcp"
      - "${WEB_HTTPS_PORT:-8443}:8443/tcp"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?Falta PIHOLE_PASSWORD en .env}
      FTLCONF_webserver_port: "8080,8443s"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "172.30.53.2#53"
      FTLCONF_dns_dnssec: "false"
      FTLCONF_webserver_interface_theme: "default-dark"
      # Nombres locales (p. ej. aria.lan) -> IP de la Raspberry. Formato: "IP nombre;IP nombre"
      FTLCONF_dns_hosts: ${LOCAL_DNS_HOSTS:-}
    volumes:
      - ./data/pihole:/etc/pihole
    networks:
      shield:
        ipv4_address: 172.30.53.3

networks:
  shield:
    name: shield-dns
    ipam:
      config:
        - subnet: 172.30.53.0/24
